<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><style>body{visibility:hidden}</style><style id="st"></style><style>pre{white-space:pre-wrap;font-size:.8rem}#plist{display:none}#plist .pg{page-break-after:always;font-size:12px;line-height:1.7;color:#000;background:#fff;padding:6px}#plist .pg:last-child{page-break-after:auto}#plist .pg table{border-collapse:collapse;width:100%;margin:5px 0}#plist .pg th,#plist .pg td{border:1px solid #000;padding:2px 6px;text-align:right;font-size:11px}#plist .pg h2,#plist .pg h3{text-align:center;margin:3px 0}#plist .logos{direction:rtl;display:flex;justify-content:space-between;align-items:center;min-height:10px}#plist .logos img{height:66px;max-width:30%;object-fit:contain}#plist .dots{border-bottom:1px dotted #000;display:inline-block;min-width:140px;padding:0 6px}#plist .wc{padding:4px 0;border-top:1px solid #888}#plist .wc1,#plist .wc1 *{color:#0b3fb8}#plist .wc2,#plist .wc2 *{color:#c00000}@page{size:A4;margin:8mm}@media print{.tabs,button,input,select{display:none!important}body.pl>*:not(#plist){display:none!important}body.pl #plist{display:block!important}#plist table{font-size:11px}}</style></head><body><header><button id="th" aria-label="تبديل الوضع">◐</button><h1>لوحة تحكم الإدارة – نظام تسجيل الرغبات</h1></header><main id="app"></main><div class="ft">Created by Abdelrhman Sayed</div><div id="plist"></div>
<script type="module">
import{auth,db,A,F,css,email,mask,esc,loadCatalog,DRIVE_CLIENT_ID,DRIVE_FOLDER,toggleTheme}from"./firebase.js";
import{fa,parseStudents,mergeStudents,parseAdvisors,parseCatalog,catalogRows}from"./logic.js";
document.getElementById("st").textContent=css;document.body.style.visibility="visible";document.getElementById("th").onclick=toggleTheme;
const app=document.getElementById("app"),$=s=>document.querySelector(s),NA="غير موجود";
let MURL="",BR={},R=[],ADV=[],AI=[],U={},ME,tab="stats",q="",pq="",CAT,SET={allowPrint:true},PEND={},tok=null,tokExp=0;
const login=(m="")=>{app.innerHTML=`<div class="card"><h3>دخول المسؤول</h3>${m}<label>الرقم القومي</label><input id="n" inputmode="numeric"><label>كلمة المرور</label><input id="p" type="password"><label style="display:flex;gap:8px;align-items:center"><input id="r" type="checkbox" style="width:auto">تذكرني (البقاء مسجلًا على هذا الجهاز)</label><button id="go">دخول</button></div>`;$("#go").onclick=async()=>{try{await A.setPersistence(auth,$("#r").checked?A.browserLocalPersistence:A.browserSessionPersistence);await A.signInWithEmailAndPassword(auth,email($("#n").value.trim()),$("#p").value)}catch(e){login('<div class="msg err">بيانات غير صحيحة</div>')}}};
A.onAuthStateChanged(auth,async u=>{if(!u)return login();const a=await F.getDoc(F.doc(db,"admins",u.uid));if(!a.exists()){await A.signOut(auth);return login('<div class="msg err">هذا الحساب ليس مسؤولًا</div>')}ME=a.data();await load();draw()});
async function load(){U={};(await F.getDocs(F.collection(db,"users"))).forEach(d=>U[d.data().serial]={...d.data(),uid:d.id});const r=await F.getDoc(F.doc(db,"public","roster"));R=r.exists()?JSON.parse(r.data().json):[];ADV=r.exists()?(r.data().advisors||[]):[];const s=await F.getDoc(F.doc(db,"config","settings"));if(s.exists())SET=s.data();const b=await F.getDoc(F.doc(db,"public","branding"));BR=b.exists()?b.data():{};try{const mm=await F.getDoc(F.doc(db,"public","mail"));MURL=mm.exists()?mm.data().url||"":""}catch(e){}CAT=await loadCatalog();try{const x=await F.getDoc(F.doc(db,"config","advisorInfo"));AI=x.exists()?JSON.parse(x.data().json):[]}catch(e){AI=[]}}
const log=(a,t,r)=>F.addDoc(F.collection(db,"logs"),{admin:ME.name,action:a,target:t,reason:r||"",at:F.serverTimestamp()});
async function saveRoster(list,advs,action,target){const json=JSON.stringify(list);if(json.length>900000)throw Error("حجم الكشف كبير جدًا");await F.setDoc(F.doc(db,"public","roster"),{json,advisors:advs,updatedAt:F.serverTimestamp()});R=list;ADV=advs;localStorage.removeItem("roster");await log(action,target)}
const saveCat=async(c,a)=>{await F.setDoc(F.doc(db,"config","catalog"),{json:JSON.stringify(c)});CAT=c;await log(a,"catalog")};
const cleanA=s=>String(s||"").replace(/^(أ\.?\s*د|د|دكتور|الدكتور)\s*\.?\s*\/\s*/,"").trim();
const infoOf=n=>{if(!n||n==NA)return null;const k=fa(cleanA(n));return AI.find(x=>fa(cleanA(x.name))==k)||AI.find(x=>{const y=fa(cleanA(x.name));return y.length>8&&(y.startsWith(k)||k.startsWith(y))})||null};
const deptOf=n=>infoOf(n)?.dept||"";
function parseAdvInfo(rows){rows=rows.filter(r=>r.some(c=>String(c).trim()));if(!rows.length)throw Error("الملف فارغ");const h=rows[0].map(x=>String(x).trim().toLowerCase());let ie=h.findIndex(x=>x.includes("ميل")||x.includes("mail")||x.includes("بريد")),id=h.findIndex(x=>x.includes("قسم")||x.includes("dep")),inn=h.findIndex((x,i)=>i!=ie&&i!=id&&(x.includes("اسم")||x.includes("مرشد")||x.includes("name")));const hasH=ie>=0||id>=0||inn>=0;if(!hasH){inn=0;ie=1;id=2}else{if(inn<0)inn=0;if(ie<0)throw Error("لم أجد عمود الايميل");if(id<0)throw Error("لم أجد عمود القسم")}
const out=[],bad=[];for(const r of rows.slice(hasH?1:0)){const n=String(r[inn]||"").replace(/\s+/g," ").trim(),e=String(r[ie]||"").trim(),d=String(r[id]||"").replace(/\s+/g," ").trim();if(!n)continue;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){bad.push(n+" (ايميل غير صالح)");continue}out.push({name:n,email:e,dept:d})}if(!out.length)throw Error("لا توجد بيانات صالحة"+(bad.length?"\n"+bad.join("\n"):""));return{list:out,bad}}
const MS=()=>localStorage.getItem("mailSecret")||"";
async function pushAdvisors(list){const c=await F.getDoc(F.doc(db,"public","mail")),url=c.exists()?c.data().url:"";if(!url)return"لم يُضبط رابط خدمة الإيميل (الإعدادات)، لذلك لم تُرسل القائمة للخدمة.";if(!MS())return"لم تُحفظ كلمة سر الخدمة (الإعدادات)، لذلك لم تُرسل القائمة للخدمة.";try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"advisors",secret:MS(),advisors:list})});const j=await r.json();return j.ok?"وصلت قائمة المرشدين لخدمة الإيميل ("+j.count+" مرشد).":"رفضت الخدمة القائمة ("+j.error+"). تأكد من كلمة السر.";}catch(e){return"تعذر الاتصال بخدمة الإيميل. تأكد من الرابط."}}
const isReg=id=>!!U[id],st=u=>!u?"لم يسجل":u.status=="printed"?"تم الاعتماد والطباعة":u.reopenCount&&u.locked===false?"مفتوح للتعديل":u.choices?.some(c=>c.program)?"محفوظ":"حساب بلا رغبات";
const msg=(c,t)=>`<div class="msg ${c}"><pre>${esc(t)}</pre></div>`;
/* ---------- Excel ---------- */
const loadXL=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(Error("تعذر تحميل مكتبة Excel، تحقق من الإنترنت"));document.head.appendChild(s)});
async function readSheets(f){await loadXL();const wb=/\.csv$/i.test(f.name)?XLSX.read(await f.text(),{type:"string"}):XLSX.read(await f.arrayBuffer(),{type:"array"});return wb.SheetNames.map(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}))}
async function mkBook(sheets){await loadXL();const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};for(const n in sheets)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sheets[n]),n.slice(0,30));return wb}
async function dl(name,sheets){XLSX.writeFile(await mkBook(sheets),name)}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
const nmP=id=>CAT.programs.find(p=>p.id==id)?.name||"";
const backupSheets=()=>({"الاستمارات":[["الكود","الاسم","الرقم القومي","الهاتف","المرشد","الحالة","تاريخ الطباعة","رغبة1 برنامج","مقرر1","مقرر2","مقرر3","رغبة2 برنامج","مقرر1","مقرر2","مقرر3","رغبة3 برنامج","مقرر1","مقرر2","مقرر3"],...Object.values(U).sort((a,b)=>a.serial-b.serial).map(u=>[u.serial,u.name,u.nid,u.phone,R.find(s=>s.id==u.serial)?.advisor||u.advisor,st(u),u.printedAt?.toDate?.().toLocaleString("ar-EG")||"",...[0,1,2].flatMap(i=>{const c=u.choices?.[i]||{};return[nmP(c.program),c.c1||"",c.c2||"",c.c3||""]})])],"الكشف":[["الكود","الاسم","المرشد"],...R.map(s=>[s.id,s.name,s.advisor])],...catalogRows(CAT)});
/* ---------- Google Drive ---------- */
const gis=()=>new Promise((ok,no)=>{if(window.google?.accounts?.oauth2)return ok();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=ok;s.onerror=()=>no(Error("تعذر تحميل خدمة Google"));document.head.appendChild(s)});
async function driveToken(){if(!DRIVE_CLIENT_ID)throw Error("لم يتم ضبط DRIVE_CLIENT_ID في firebase.js");if(tok&&Date.now()<tokExp)return tok;await gis();return new Promise((ok,no)=>google.accounts.oauth2.initTokenClient({client_id:DRIVE_CLIENT_ID,scope:"https://www.googleapis.com/auth/drive.file",callback:r=>{if(r.error)return no(Error(r.error));tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;ok(tok)}}).requestAccessToken({prompt:""}))}
async function driveUpload(blob,name){const t=await driveToken(),H={Authorization:"Bearer "+t};const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);let r=await(await fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id)",{headers:H})).json();let id=r.files?.[0]?.id;if(!id){r=await(await fetch("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:"application/vnd.google-apps.folder"})})).json();id=r.id}if(!id)throw Error("تعذر إنشاء مجلد Drive");const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify({name,parents:[id]})],{type:"application/json"}));fd.append("file",blob);const u=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:H,body:fd});if(!u.ok)throw Error("فشل الرفع إلى Drive ("+u.status+")");return u.json()}
/* ---------- UI ---------- */
function draw(){const us=Object.values(U),c=f=>us.filter(f).length;
const stats=[["إجمالي الطلاب في الكشف",R.length],["أنشأوا حسابات",us.length],["بدأوا التسجيل",c(u=>u.choices?.some(x=>x.program))],["حفظوا ولم يطبعوا",c(u=>u.status!="printed"&&u.choices?.some(x=>x.program))],["اعتمدوا وطبعوا",c(u=>u.status=="printed")],["لم يسجلوا",R.length-us.length],["فُتحوا للتعديل",c(u=>u.reopenCount>0)]];
const T={stats:()=>`<div class="row">${stats.map(s=>`<div class="card"><b style="font-size:1.6rem">${s[1]}</b><br>${s[0]}</div>`).join("")}</div><div class="card"><b>السماح بالطباعة (عام)</b><button data-a="tg" class="${SET.allowPrint?"":"red"}">${SET.allowPrint?"مفعّل – اضغط للإيقاف":"متوقف – اضغط للتفعيل"}</button></div>`,
students:()=>`<div class="row"><input id="ns" placeholder="اسم طالب جديد"><button data-a="addS">إضافة طالب</button></div><input id="q" placeholder="بحث بالاسم أو الكود" value="${esc(q)}"><div class="scroll"><table><tr><th>كود</th><th>الاسم</th><th>المرشد</th><th>الحالة</th><th></th></tr>${R.filter(s=>!q||fa(s.name).includes(fa(q))||String(s.id)==q).slice(0,100).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.advisor)}</td><td>${st(U[s.id])}</td><td>${U[s.id]?`<button class="alt" data-a="view" data-v="${s.id}">فتح</button>`:""}<button class="alt" data-a="setAdv" data-v="${s.id}">مرشد</button><button class="red" data-a="delS" data-v="${s.id}">حذف</button></td></tr>`).join("")}</table></div><small>يظهر أول 100 نتيجة، استخدم البحث.</small><div id="det"></div>`,
printed:()=>{const p=Object.values(U).filter(u=>u.status=="printed"&&(!pq||fa(u.name).includes(fa(pq))||String(u.serial)==pq||u.nid.includes(pq))).sort((a,b)=>a.serial-b.serial);return`<h3>الطلاب الذين قاموا باعتماد وطباعة الاستمارة (${p.length})</h3><input id="pq" placeholder="بحث بالاسم أو الكود أو الرقم القومي" value="${esc(pq)}"><button data-a="exPr">تصدير Excel</button><button class="alt" data-a="pdf">تصدير PDF</button><div class="scroll"><table><tr><th>الكود</th><th>الاسم</th><th>الرقم القومي</th><th>الهاتف</th><th>الحالة</th><th>تاريخ الطباعة</th></tr>${p.map(u=>`<tr><td>${u.serial}</td><td>${esc(u.name)}</td><td>${u.nid}</td><td>${u.phone}</td><td>تم الاعتماد والطباعة</td><td>${u.printedAt?.toDate?.().toLocaleString("ar-EG")||""}</td></tr>`).join("")}</table></div>`},
prt:()=>{const ids=[...ADV,NA],cnt=n=>Object.values(U).filter(u=>u.status=="printed"&&advOf(u)==n).length;return`<h3>الطباعة حسب المرشد الأكاديمي</h3><p style="font-size:.85rem">اضغط طباعة لطباعة استمارات الطلاب الذين اعتمدوا وطبعوا نتيجتهم والتابعين لهذا المرشد فقط (بياناتهم ورغباتهم كاملة، استمارة لكل طالب في صفحة).</p><div class="scroll"><table><tr><th>المرشد</th><th>القسم</th><th>عدد المعتمدين</th><th></th></tr>${ids.map(n=>`<tr><td>${esc(n)}</td><td>${esc(deptOf(n))||"—"}</td><td>${cnt(n)}</td><td><button data-a="prAdv" data-v="${esc(n)}" ${cnt(n)?"":"disabled"}>طباعة</button></td></tr>`).join("")}</table></div>`},
files:()=>{const fc=(k,t,d,extra="")=>`<div class="card"><b>${t}</b><p style="font-size:.85rem;margin:4px 0">${d}</p><input type="file" accept=".xlsx,.xls,.csv" data-f="${k}">${extra}<div id="pv-${k}">${PEND[k]?.html||""}</div><button data-a="apply" data-v="${k}" ${PEND[k]?.ok?"":"disabled"}>اعتماد الاستيراد</button><button class="alt" data-a="dlCur" data-v="${k}">تنزيل الملف الحالي (قالب Excel)</button></div>`;
return`${fc("students","1) ملف أسماء الطلاب","أعمدة: الكود (اختياري) | الاسم. الأكواد الحالية تُحفظ، والأسماء الجديدة تأخذ الكود التالي.",`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rm" style="width:auto">حذف الأسماء غير الموجودة بالملف (عدا المسجلين)</label>`)}${fc("advisors","2) ملف المرشدين الأكاديميين","أعمدة: المرشد | اسم الطالب (صف لكل طالب). من لا يوجد في الملف يُكتب له: غير موجود. هذا الملف يستبدل التوزيع الحالي.")}${fc("advinfo","4) ملف بيانات المرشدين (الاسم والايميل والقسم)",`أعمدة: الاسم | الايميل | القسم. الايميل يُستخدم لإرسال استمارة الطالب للمرشد عند الاعتماد، والقسم يظهر في قسم الطباعة. الحالي: ${AI.length} مرشد.`)}${fc("desires","3) ملف الرغبات (البرامج والمقررات)","3 أوراق بالترتيب: البرامج | مقررات البرامج | المقررات الاختيارية. يستبدل الكتالوج الحالي.")}
<div class="card"><b>Google Drive والنسخ الاحتياطي</b><p style="font-size:.85rem">${DRIVE_CLIENT_ID?"Drive مفعّل.":"Drive غير مفعّل: ضع DRIVE_CLIENT_ID في firebase.js (الخطوات في README)."}</p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="dv" style="width:auto" ${DRIVE_CLIENT_ID?"checked":"disabled"}>حفظ نسخة من أي ملف أرفعه في Drive</label><button data-a="bkDrive" ${DRIVE_CLIENT_ID?"":"disabled"}>نسخة احتياطية كاملة إلى Drive</button><button class="alt" data-a="bkLocal">تنزيل نسخة احتياطية كاملة</button><div id="bkm"></div></div>`},
advisors:()=>`<div class="row"><input id="na" placeholder="اسم مرشد جديد"><button data-a="addA">إضافة مرشد</button></div><div class="scroll"><table><tr><th>المرشد</th><th>عدد الطلاب</th><th></th></tr>${ADV.map(a=>`<tr><td>${esc(a)}</td><td>${R.filter(s=>s.advisor==a).length}</td><td><button class="alt" data-a="renA" data-v="${esc(a)}">تعديل</button><button class="red" data-a="delA" data-v="${esc(a)}">حذف</button></td></tr>`).join("")}</table></div><p>طلاب بلا مرشد: ${R.filter(s=>s.advisor==NA).length}</p>`,
catalog:()=>`<div class="card"><b>البرامج والمقررات المؤهلة والاختيارية وقواعد الإتاحة (JSON)</b><p style="font-size:.8rem">يمكنك الإضافة والحذف والتعديل هنا، أو رفع ملف الرغبات من تبويب الملفات. active لإيقاف برنامج، blocked لبرامج ممنوع عليها المقرر.</p><textarea id="cj" rows="18" style="direction:ltr;font-family:monospace">${esc(JSON.stringify(CAT,null,1))}</textarea><button data-a="saveCat">حفظ الكتالوج</button></div>`,
logs:()=>`<button class="red" data-a="clrLog">مسح السجل</button><div id="lg">جارٍ التحميل…</div>`,
settings:()=>`<div class="card"><b>الشعارات (تظهر أعلى الاستمارة المطبوعة)</b>${[["univ","شعار الجامعة"],["college","شعار الكلية"],["unit","شعار الإرشاد الأكاديمي"]].map(([k,t])=>`<label>${t}</label>${BR[k]?`<img src="${BR[k]}" style="height:60px;display:block;margin:6px 0">`:""}<input type="file" accept="image/*" data-l="${k}">${BR[k]?`<button class="alt" data-a="delLogo" data-v="${k}">حذف الشعار</button>`:""}`).join("")}</div><div class="card"><b>حساب الإدارة</b><label>الاسم</label><input id="mn" value="${esc(ME.name)}"><label>الإيميل الجامعي</label><input id="me" value="${esc(ME.universityEmail)}"><label>رقم الموبايل</label><input id="mp" value="${esc(ME.phone)}"><button data-a="saveMe">حفظ البيانات</button><hr><label>كلمة المرور الحالية</label><input id="cp" type="password"><label>كلمة المرور الجديدة (8 أحرف فأكثر)</label><input id="np" type="password"><button data-a="savePw">تغيير كلمة المرور</button><p style="font-size:.8rem">الرقم القومي هو اسم الدخول ولا يتغير من هنا.</p></div><div class="card"><b>خدمة إيميل المرشدين (Google Apps Script)</b><p style="font-size:.85rem">الصق رابط الخدمة (ينتهي بـ /exec) وكلمة السر، ثم اضغط حفظ وإرسال القائمة.</p><label>رابط الخدمة</label><input id="mu" style="direction:ltr" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(MURL)}"><label>كلمة السر (تُحفظ على هذا الجهاز فقط)</label><input id="ms" type="password" style="direction:ltr" value="${esc(MS())}"><button data-a="saveMail">حفظ وإرسال قائمة المرشدين للخدمة</button><div id="mm"></div></div><div class="card"><b style="color:#b3261e">منطقة الخطر</b><p style="font-size:.85rem">يمسح كل الطلاب والحسابات والاستمارات والسجل والكشف والمرشدين والكتالوج. لا يمسح حساب الأدمن ولا الشعارات.</p><button class="red" data-a="wipe">مسح بيانات النظام بالكامل</button></div>`};
const tabs=[["stats","إحصائيات"],["students","الطلاب"],["printed","المعتمدون"],["prt","الطباعة"],["files","الملفات والنسخ"],["advisors","المرشدون"],["catalog","البرامج والمقررات"],["settings","الإعدادات"],["logs","السجل"]];
app.innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="${tab==t[0]?"":"alt"}" data-t="${t[0]}">${t[1]}</button>`).join("")}<button class="alt" data-a="out">خروج</button></div><div class="card" style="margin-top:12px">${T[tab]()}</div>`;
