$("#ls").onclick=e=>{const i=e.target.dataset.i;if(!i)return;sel=STU.find(s=>s.id==i);$("#ls").classList.add("hide");$("#q").value=sel.name;$("#f").classList.remove("hide");$("#info").innerHTML=`الاسم: ${esc(sel.name)}<br>الكود التسلسلي: ${sel.id}`};
